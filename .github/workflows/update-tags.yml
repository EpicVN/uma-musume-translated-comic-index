name: Run Auto Tag Update

on:
  # Cho phép bấm nút trigger thủ công trên giao diện GitHub
  workflow_dispatch:

  # Chạy tự động theo lịch (Ví dụ: chạy mỗi 6 tiếng một lần theo giờ UTC)
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Run update script
        run: npx tsx scripts/update-latest.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
